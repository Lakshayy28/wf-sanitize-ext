# =============================================================================
# SafeChat Master Configuration
# =============================================================================
# This file controls the behavior of the @safechat VS Code Extension.
# It is re-read on every @safechat prompt — no reload or server restart needed.
#
# Routing happens automatically via the Graceful Degradation Pipeline:
#   1. Binary files / NUL bytes        → blocked (never forwarded to Copilot)
#   2. Source code / docs              → bypass  (forwarded as-is, no scan)
#   3. Mega-files (> 1 MB) or          → Tier 3 regex-only (Presidio skipped)
#      minified lines (> 10 000 chars)
#   4. Known structured formats        → Tier 2 Tree-sitter CST
#      (.json .yaml .env .properties)    (WASM grammars, 4 languages)
#   5. Unknown ext — content sniffed   → Tier 2 Tree-sitter if JSON/YAML/XML/bash
#   6. Unknown ext — KV detected       → Tier 2B Universal KV Lexer
#      (=  :  ->  >>  delimiters)
#   7. Everything else                 → Tier 3 Full DLP
#      (.log .txt .csv unstructured)    Regex + Entropy + Presidio NLP
#
# Use ast_extensions / full_dlp_extensions below only when the automatic
# routing needs an explicit override for an internal/proprietary format.
# =============================================================================

# ── 1. AST Routing Overrides ─────────────────────────────────────────────────
# Force proprietary or vendor-specific extensions into the Tier 2 AST engine
# (Tree-sitter CST parser or Universal KV Lexer, depending on content).
# The Content Sniffer handles most cases automatically — add entries here only
# when the sniffer does not recognise your internal format.
# (Dotfiles are matched by their full basename e.g. ".kube_vars")
# ─────────────────────────────────────────────────────────────────────────────
ast_extensions: 
  # Force these into the Tier 2 AST Guardian (Structure preservation, no NLP)
  - .custom_env
  - .kube_vars
  - .mycompany_conf

full_dlp_extensions: 
  # Force these into Tier 3 Full DLP (Regex + Shannon Entropy + Presidio NLP).
  # Use for log files, audit dumps, and chat transcripts that contain human PII
  # not detectable by the key-name-based AST engine.
  - .audit_log
  - .splunk_dump
  - .chat_transcript


# ── 2. Dynamic Secret Builder (TypeScript Engine) ────────────────────────────
# Define custom internal developer secrets here. The TypeScript extension will:
# 1. Inject `ast_keys` into the Tier 2 Tree-sitter / KV parsers so those keys
#    are masked immediately at the AST level.
# 2. Dynamically compile a mathematically safe regex from the prefix/charset/
#    length and add it to the Tier 3 regex dictionary for unstructured text.
# ─────────────────────────────────────────────────────────────────────────────
custom_secrets:
  # Catch Base64 encoded usernames or DB logins in configurations
  - name: "App Usernames"
    ast_keys: ["username", "db_user", "login"] 

  # Example: Dynamically compiles \b(acme_live_[A-Za-z0-9_\-]{32})\b
  - name: "Acme Corp Production Token"
    ast_keys: ["acme_prod", "acme_token"]
    value_prefix: "acme_live_"            
    value_charset: "alphanumeric"         # Options: alphanumeric, hex, base64, all
    value_length: "32"                    


# ── 3. NLP Entity Overrides (Python Presidio Engine) ─────────────────────────
# Define how the Python NLP engine handles Human PII and Financial Data.
# Tech Secrets (AWS, GitHub, etc.) are handled by TypeScript, NOT here.
#
# Operations: 
#   replace  — substitute with a labelled placeholder (e.g. <PHONE_NUMBER>)
#   mask     — substitute with asterisks (e.g. ****)
#   redact   — completely remove the detected text
# ─────────────────────────────────────────────────────────────────────────────
rules:
  PERSON: replace
  EMAIL_ADDRESS: replace
  PHONE_NUMBER: replace
  CREDIT_CARD: mask
  US_SSN: mask
  IP_ADDRESS: replace
  IBAN_CODE: mask
  URL: replace
  CARD_CVV: mask       # Custom financial entity from financial.py
  CARD_EXPIRY: mask    # Custom financial entity from financial.py


# ── 4. Custom PII Recognizers (Python Presidio Engine) ───────────────────────
# Add custom regexes ONLY for Human Data (e.g., employee IDs, support tickets) 
# that require NLP context words to avoid false positives. 
# (DO NOT put API keys or passwords here — put them in custom_secrets above!)
# ─────────────────────────────────────────────────────────────────────────────
custom_recognizers:
  - name: EMPLOYEE_ID
    pattern: "EMP-\\d{6}"
    score: 0.9
    context:
      - employee
      - staff
      - badge

  - name: CUSTOMER_ACCOUNT
    pattern: "CUST-[A-Z]{2}\\d{8}"
    score: 0.9
    context:
      - customer
      - account
      - billing