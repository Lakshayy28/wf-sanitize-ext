# =============================================================================
# SafeChat Master Configuration
# =============================================================================
# This file controls the behavior of the @safechat VS Code Extension.
# It is re-read on every @safechat prompt — no reload or server restart needed.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  ARCHITECTURE: Hybrid Edge (TypeScript extension + Python server)      │
# │                                                                         │
# │  TypeScript handles: Regex (22 patterns), Shannon Entropy scanner,     │
# │                       AST key-based masking (Tier 2), bare token       │
# │                       detection.                                        │
# │  Python server handles: NLP PII only (12 entity types, Tier 3).        │
# │  Without the server: Tier 2 AST + Tier 3 regex/entropy still run.      │
# │  Graceful degradation — server is optional for secret detection.       │
# │                                                                         │
# │  Start server: PYTHONPATH=<workspace> uvicorn                          │
# │                presidio_server.main:app --port 8000 --reload           │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ROUTING: Strict Default-Deny (Whitelist Only)
# ──────────────────────────────────────────────
#   0. Binary files (.pdf, .zip, .exe…)  → BLOCKED (never enter pipeline)
#   1. custom_paths (path match)         → highest priority, user-defined
#   2. ast_extensions whitelist          → Tier 2 AST (key-based masking)
#   3. full_dlp_extensions whitelist     → Tier 3 Full DLP (NLP + regex)
#   4. Everything else                   → BYPASS  (default deny, no scan)
#
#
# Add extra extensions below ONLY for proprietary/internal formats not
# already covered by the built-in lists above.
# =============================================================================

# ── 1. AST Routing Overrides ─────────────────────────────────────────────────
# Add proprietary or vendor-specific extensions to be scanned by the Tier 2
# AST engine (pure-JS parsers: JSON, YAML, XML, ENV, Properties, TOML, HCL,
# CSV/TSV). Unknown extensions are BYPASSED by default — add them here to scan.
#
# BUILT-IN AST EXTENSIONS (already scanned — do NOT re-add these):
#   Data interchange:    .json .jsonc .jsonl .yaml .yml
#   Environment/Props:   .env .properties .ini .conf .cfg .config .toml
#                        .npmrc .kubeconfig
#   Tabular data:        .csv .tsv
#   Auth/Package Mgrs:   .netrc .pgpass .gemrc .yarnrc
#   Keys/Certs:          .pem .key .cert .crt .pub .ppk .cer .asc
#   IaC:                 .tf .hcl .terraformrc .tfstate .tfvars
#   Build/Project (XML): .csproj .props .targets .nuspec .xml .xsd .wsdl
#   Secrets files:       .secret
#   Shell scripts:       .sh .bash .zsh .bat .cmd .ps1 .psm1
#   Docker/Build:        .dockerfile .gradle .kts
# ─────────────────────────────────────────────────────────────────────────────
ast_extensions: 
  # Force these into the Tier 2 AST Guardian (Structure preservation, no NLP)
  - .custom_env
  - .kube_vars
  - .mycompany_conf

# BUILT-IN FULL DLP EXTENSIONS (already scanned — do NOT re-add these):
#   .txt .log .md .sql .graphql .gql .rtf
full_dlp_extensions: 
  # Force these into Tier 3 Full DLP (Regex + Shannon Entropy + Presidio NLP).
  # Use for log files, audit dumps, and chat transcripts that contain human PII
  # not detectable by the key-name-based AST engine.
  - .audit_log
  - .splunk_dump
  - .chat_transcript


# ── 2. Path-Specific Overrides ────────────────────────────────────────────────
# Override routing for specific files or paths. These take HIGHEST priority
# (above both extension whitelists and the binary blocklist).
#
# Strategies:
#   AST      — Tier 2 key-based masking (structured configs)
#   FULL_DLP — Tier 3 NLP + regex + entropy (unstructured PII)
#   IGNORE   — bypass entirely (never scanned)
#
# Paths are matched against workspace-relative file paths. Matching is
# case-insensitive and supports suffix matching (e.g. "settings.conf"
# matches "src/config/settings.conf").
# ─────────────────────────────────────────────────────────────────────────────
custom_paths:
  # Example: Force a config file that has no recognized extension
  # - path: "src/config/internal_settings.conf"
  #   strategy: AST

  # Example: Scan a markdown file with Full DLP (already in default DLP list,
  # but you could use this to force a specific path to a different tier)
  # - path: "docs/sensitive_architecture.md"
  #   strategy: FULL_DLP

  # Example: Exclude a noisy generated file from scanning entirely
  # - path: "generated/api_schema.json"
  #   strategy: IGNORE


# ── 3. Dynamic Secret Builder ─────────────────────────────────────────────────
# Define custom internal developer secrets here. The extension will:
# 1. Inject `ast_keys` into the Tier 2 AST parsers so those keys are masked
#    immediately at the AST level (key-name detection).
# 2. Pass prefix/charset/length definitions to the Python server, which
#    dynamically compiles regex patterns for Tier 3 unstructured text scanning.
# ─────────────────────────────────────────────────────────────────────────────
custom_secrets:
  # Catch Base64 encoded usernames or DB logins in configurations
  - name: "App Usernames"
    ast_keys: ["username", "db_user", "login"] 

  # Example: Dynamically compiles \b(acme_live_[A-Za-z0-9_\-]{32})\b
  - name: "Acme Corp Production Token"
    ast_keys: ["acme_prod", "acme_token"]
    value_prefix: "acme_live_"            
    value_charset: "alphanumeric"         # Options: alphanumeric, hex, base64, all
    value_length: "32"                    


# ── 4. NLP Entity Overrides (Python Presidio Server) ─────────────────────────
# Define how the Python Presidio server handles Human PII and Financial Data.
# These rules are passed as part of the API payload to POST /sanitize.
# The 12 active entities are: PERSON, EMAIL_ADDRESS, PHONE_NUMBER, CREDIT_CARD,
# US_SSN, IBAN_CODE, US_BANK_NUMBER, CRYPTO, IP_ADDRESS, URL, CARD_CVV, CARD_EXPIRY
#
# Operations:
#   replace  — substitute with a labelled placeholder (e.g. <PHONE_NUMBER>)
#   mask     — substitute with asterisks (e.g. ****)
#   redact   — completely remove the detected text
#   hash     — one-way SHA-256 digest (repeatable for same value)
# ─────────────────────────────────────────────────────────────────────────────
rules:
  PERSON: replace
  EMAIL_ADDRESS: replace
  PHONE_NUMBER: replace
  CREDIT_CARD: mask
  US_SSN: mask
  IP_ADDRESS: replace
  IBAN_CODE: mask
  URL: replace
  CARD_CVV: mask       # Custom financial entity from financial.py
  CARD_EXPIRY: mask    # Custom financial entity from financial.py


# ── 5. Custom PII Recognizers (Python Presidio Server) ───────────────────────
# Add custom regexes ONLY for Human Data (e.g., employee IDs, support tickets)
# that require NLP context words to avoid false positives.
# These are dynamically registered as Presidio PatternRecognizer objects on
# the server at runtime.
# ─────────────────────────────────────────────────────────────────────────────
custom_recognizers:
  - name: EMPLOYEE_ID
    pattern: "EMP-\\d{6}"
    score: 0.9
    context:
      - employee
      - staff
      - badge

  - name: CUSTOMER_ACCOUNT
    pattern: "CUST-[A-Z]{2}\\d{8}"
    score: 0.9
    context:
      - customer
      - account
      - billing