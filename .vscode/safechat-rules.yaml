# =============================================================================
# SafeChat Smart Proxy — Configuration
# =============================================================================
# This file provides optional tuning for the @safechat VS Code Extension.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  ARCHITECTURE: Smart Proxy (Polyglot AST Router)                       │
# │                                                                         │
# │  Zero custom tools. All native Copilot tools execute unimpeded.        │
# │  Results are intercepted and routed through format-aware sanitizers:    │
# │                                                                         │
# │    .json / .jsonc    → JSON.parse → maskObjectValues → JSON.stringify  │
# │    .yaml / .yml      → yaml.parse → maskObjectValues → yaml.stringify  │
# │    .xml / .svg       → XMLParser  → maskObjectValues → XMLBuilder      │
# │    .env / .ini       → Line-by-line key=value → regexSanitize(value)  │
# │    .ts/.py/.go/etc   → BYPASS (code files are safe)                    │
# │    .log/.txt/unknown → truncateAndSanitize (250KB + 22 regex patterns)│
# │                                                                         │
# │  Write-Guard: file-write + terminal tools checked for [MASKED] tokens  │
# │  Fail-Closed: AST parse errors always fall to regex, never fail-open   │
# └─────────────────────────────────────────────────────────────────────────┘
#
# =============================================================================


# ── 1. Code File Bypass Extensions ───────────────────────────────────────────
# Source code files are BYPASSED by default (never scanned). The following
# 40+ extensions are hardcoded in sanitizer.ts:
#
#   .ts .tsx .js .jsx .mjs .cjs .py .pyw .java .kt .kts .scala .go .rs
#   .c .h .cpp .hpp .cc .cxx .cs .rb .php .swift .m .mm .dart .lua .r .R
#   .pl .pm .sh .bash .zsh .fish .ps1 .psm1 .sql .vue .svelte .tf .hcl
#   .proto .graphql .gql
#
# To add additional bypass extensions, use the VS Code setting:
#   "safechat.ignoreExtensions": [".myext", ".custom"]
# ─────────────────────────────────────────────────────────────────────────────


# ── 2. Regex Pattern Dictionary (22 Patterns) ───────────────────────────────
# The following patterns run on ALL non-bypassed text. They are hardcoded
# in sanitizer.ts and cannot be disabled via config:
#
# Cloud & CI/CD:
#   AWS Access Key (AKIA...), GCP Service Account (private_key),
#   Azure Shared Key (AccountKey=), GitHub Token (ghp_/gho_/ghu_/ghs_/ghr_),
#   GitLab Token (glpat-), Jenkins Token, Harness Token (pat./sat.),
#   OpenShift Token (sha256~), LambdaTest/SauceLabs credentials
#
# APIs & Comms:
#   Slack (xoxb-/xoxp-), Stripe (sk_live_/pk_live_), SendGrid (SG.),
#   NPM (npm_), HashiCorp Vault (hvs./hvb./hvr.), SonarQube (sqp_/squ_),
#   Terraform Cloud (*.atlasv1.*), Bitbucket (ATBB/ATCTT)
#
# Crypto Material:
#   RSA/PEM Private Keys (-----BEGIN...PRIVATE KEY-----), JWT (eyJ...)
#
# URLs:
#   Query parameter secrets (?password=&token=), Credential URLs (user:pass@host)
#
# Credentials:
#   .netrc password fields, .pgpass colon-delimited passwords
#
# Standard PII:
#   US SSN (xxx-xx-xxxx), Credit Card (16 digits), IBAN, IPv4, Internal
#   Hostname (*.internal/*.local), MAC Address, Certificate Thumbprint,
#   Email Address, Phone Number
# ─────────────────────────────────────────────────────────────────────────────


# ── 3. AST-Parsed Formats ───────────────────────────────────────────────────
# The following formats are parsed structurally. Keys/tags/attributes are
# preserved; only VALUES are piped through the regex dictionary:
#
# JSON:  .json .jsonc .json5
# YAML:  .yaml .yml
# XML:   .xml .xsl .xslt .svg .plist
# ENV:   .env .ini .cfg .properties .env.local .env.production .env.development
#
# If parsing fails for ANY reason, the text falls to truncateAndSanitize()
# (fail-closed guarantee — never fails open).
# ─────────────────────────────────────────────────────────────────────────────


# ── 4. Write-Guard Tool Patterns ────────────────────────────────────────────
# The following tool names trigger the Write-Guard check. If the tool's
# INPUT contains [MASKED_BY_SAFECHAT], a warning is emitted to the chat
# stream before execution:
#
# File Writes:
#   vscode_applyWorkspaceEdit, apply_workspace_edit, apply_edit, edit_file,
#   write_file, create_file, insert_edit, replace_string, apply_diff,
#   save_file, overwrite_file
#
# Terminal Execution:
#   run_command, terminal_execute, run_in_terminal, vscode_runCommand,
#   exec, execute_command, bash
#
# Description keywords also trigger:
#   "apply workspace edit", "write to file", "create a file",
#   "run a command", "execute command", "terminal", "shell command"
# ─────────────────────────────────────────────────────────────────────────────


# ── 5. Truncation Budget ────────────────────────────────────────────────────
# Non-AST payloads (catch-all route) exceeding 250KB are truncated at the
# nearest newline before scanning. This prevents:
#   - V8 heap pressure from multi-MB regex operations
#   - LLM context window overflow
#   - Catastrophic regex backtracking on massive inputs
# ─────────────────────────────────────────────────────────────────────────────