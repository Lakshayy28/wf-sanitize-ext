# =============================================================================
# safechat-rules.toml — User-Supplied Gitleaks Rule Overrides
# =============================================================================
#
# HOW TO USE
# ──────────
# 1. Copy this file to your workspace root and rename it: safechat-rules.toml
# 2. Uncomment or add rules for the secret patterns you care about.
# 3. Save the file — @safechat hot-reloads it automatically (no restart needed).
#
# WHAT THIS FILE DOES
# ───────────────────
# @safechat uses Gitleaks to scan files you share with Copilot. By default it
# ships with ~160 built-in rules + 26 SafeChat custom rules. This file lets you
# EXTEND that coverage with org-specific or industry-specific patterns without
# modifying the extension itself.
#
# KEY GITLEAKS TOML CONCEPTS
# ──────────────────────────
#  [[rules]]          — add a new detection rule
#  id                 — unique identifier (used in reports and logs)
#  description        — human-readable label
#  regex              — Go RE2 regex; the full match (or secretGroup) is redacted
#  secretGroup        — capture group index to redact (default: full match)
#  entropy            — minimum Shannon entropy (float, e.g. 3.5) — filters
#                       low-entropy placeholders like "changeme" or "example"
#  keywords           — fast pre-filter; rule only runs if keyword appears in
#                       the surrounding ~250 chars (much faster than regex alone)
#  tags               — arbitrary labels for grouping / filtering
#  [[rules.allowlists]] — per-rule exclusions (regex, path, or stopword-based)
#  [[allowlists]]     — global exclusions applied to ALL rules
#
# ENTROPY GUIDE
# ─────────────
#  No entropy check  → catches everything matching the regex (may be noisy)
#  entropy = 3.0     → filters very low entropy (e.g. "aaaaaaa", "1234567")
#  entropy = 3.5     → recommended for generic credentials (filters placeholders)
#  entropy = 4.0     → high bar — only catches very random-looking values
#
# IMPORTANT — this file uses [extend] useDefault = true, which means Gitleaks
# inherits ALL built-in rules from the bundled binary. Your rules are additive.
# =============================================================================

title = "SafeChat User Custom Rules"

[extend]
# Inherit all default Gitleaks rules (~160+) from the bundled binary.
# Your [[rules]] entries below extend on top of these.
useDefault = true


# ─────────────────────────────────────────────────────────────────────────────
# SECTION 1 — Internal / Proprietary Tokens
# Copy and adapt these for your org's internal token formats.
# ─────────────────────────────────────────────────────────────────────────────

# Example: internal service tokens that follow a fixed prefix pattern
# [[rules]]
# id          = "myorg-service-token"
# description = "MyOrg Internal Service Token"
# regex       = '''\bmyorg_svc_[A-Za-z0-9]{32,}\b'''
# tags        = ["internal", "api"]

# Example: internal CI/CD deploy tokens
# [[rules]]
# id          = "myorg-deploy-token"
# description = "MyOrg Deployment Token"
# regex       = '''(?i)deploy[_-]?token\s*[:=]\s*["']?([A-Za-z0-9\-_]{24,})["']?'''
# secretGroup = 1
# entropy     = 3.5
# tags        = ["internal", "ci"]

# Example: internal user session tokens (base64url, 64+ chars)
# [[rules]]
# id          = "myorg-session-token"
# description = "MyOrg Session Token"
# regex       = '''sess_[A-Za-z0-9_\-]{48,}'''
# tags        = ["internal", "auth"]


# ─────────────────────────────────────────────────────────────────────────────
# SECTION 2 — Database Credentials
# ─────────────────────────────────────────────────────────────────────────────

# MySQL / MariaDB connection string password
# [[rules]]
# id          = "mysql-uri-password"
# description = "MySQL connection URI with embedded password"
# regex       = '''mysql(?:2|\+srv)?:\/\/[^:\s@]+:([^:@\s]{8,})@'''
# secretGroup = 1
# entropy     = 3.0
# tags        = ["database", "mysql"]

# Redis connection string with auth password
# [[rules]]
# id          = "redis-uri-password"
# description = "Redis connection URI with embedded password"
# regex       = '''redis(?:s)?:\/\/[^:\s@]*:([^:@\s]{8,})@'''
# secretGroup = 1
# entropy     = 3.0
# tags        = ["database", "redis"]

# MongoDB connection string with embedded password
# [[rules]]
# id          = "mongodb-uri-password"
# description = "MongoDB connection URI with embedded password"
# regex       = '''mongodb(?:\+srv)?:\/\/[^:\s@]+:([^:@\s]{8,})@'''
# secretGroup = 1
# entropy     = 3.0
# tags        = ["database", "mongodb"]

# Generic DSN / ODBC password field
# [[rules]]
# id          = "dsn-password"
# description = "ODBC / DSN connection string password"
# regex       = '''(?i)(?:PWD|Password)\s*=\s*([^;{}\r\n]{8,})'''
# secretGroup = 1
# entropy     = 3.5
# tags        = ["database", "dsn"]


